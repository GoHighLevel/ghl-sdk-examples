<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finishing setup… - GHL OAuth Example</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 80px auto;
        padding: 20px;
        background-color: #f5f5f5;
        text-align: center;
      }
      .spinner {
        margin: 40px auto;
        width: 56px;
        height: 56px;
        border: 6px solid #e0e0e0;
        border-top-color: #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <script>
      const companyId = "{{ company_id }}";

      async function poll() {
        try {
          const res = await fetch(`/install-locations?companyId=${encodeURIComponent(companyId)}`);
          const data = await res.json();
          if (data.ready && data.locationId) {
            window.location.href =
              `/oauth-result?companyId=${encodeURIComponent(companyId)}&locationId=${encodeURIComponent(data.locationId)}`;
            return;
          }
        } catch (e) {
          // keep polling on transient errors
        }
        setTimeout(poll, 5000);
      }

      poll();
    </script>
  </body>
</html>
